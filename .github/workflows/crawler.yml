name: Artifact Radar v5.3 — Grok Medsos Hunter

on:
  schedule:
    # Dijalankan setiap hari pukul 00:00 UTC, tapi script Python akan cek jadwal 8 hari
    - cron: "0 0 * * *"
  
  workflow_dispatch:
    inputs:
      force_crawl:
        description: 'Force crawl now (bypass 8-day schedule)?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-artifact-radar:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Run Artifact Radar v5.3 with Grok 4.1 Fast
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FORCE_CRAWL: ${{ github.event.inputs.force_crawl || 'false' }}
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json history.json || true
          
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "chore: Artifact Radar v5.3 - Incremental update [Grok 4.1 Fast] [skip ci]"
            git push origin main
          fi
